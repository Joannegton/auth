version: '3.8'

services:
  auth-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_TOKEN_MINS_EXPIRES_IN: ${JWT_ACCESS_TOKEN_MINS_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_DAYS_EXPIRES_IN: ${JWT_REFRESH_TOKEN_DAYS_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      CLIENT_REDIRECT_URL: ${CLIENT_REDIRECT_URL}
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:-}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:-}
      INITIAL_OWNER_NAME: ${INITIAL_OWNER_NAME:-Platform Owner}
    # Sem `ports:` de propósito — o auth é interno e NÃO é exposto no host.
    # Só serviços na rede `backend` alcançam ele em `auth-app:3001`.
    # `expose` é só documentação (na mesma rede já dá pra acessar qualquer porta).
    expose:
      - "3001"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    external: true
