apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-demo
  namespace: demos
  labels:
    app: auth-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-demo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: auth-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001

      containers:
        - name: auth
          image: joannegton/auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: auth-demo-config

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-demo-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-demo-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-demo-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-demo-secrets
                  key: JWT_PUBLIC_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-demo-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-demo-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: auth-demo-secrets
                  key: GOOGLE_CALLBACK_URL
            - name: CLIENT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: auth-demo-secrets
                  key: CLIENT_REDIRECT_URL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /auth/public-key
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /auth/public-key
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false

      terminationGracePeriodSeconds: 15
