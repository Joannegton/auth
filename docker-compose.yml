services:
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: auth-server:latest
    container_name: auth-server
    env_file:
      - .env.production
    # Sem `ports:` de propósito — o auth é interno e NÃO é exposto no host.
    # Só serviços na rede `backend` alcançam ele em `auth-server:3001`.
    expose:
      - "3001"
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    external: true
