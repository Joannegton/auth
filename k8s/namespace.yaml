apiVersion: v1
kind: Namespace
metadata:
  name: demos
  labels:
    environment: demo
    managed-by: kustomize

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demos-quota
  namespace: demos
spec:
  hard:
    pods: "4"
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1"
    limits.memory: "1Gi"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demos-network-policy
  namespace: demos
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
    - to:
        - podSelector: {}
