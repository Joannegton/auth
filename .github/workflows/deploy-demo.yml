name: Deploy Auth Demo

on:
  push:
    branches: [master, main]
    paths:
      - "auth/**"
      - "src/**"
      - "package*.json"
      - "Dockerfile"
      - "k8s/**"
      - ".github/workflows/deploy-demo.yml"

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t joannegton/auth:latest .

      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push joannegton/auth:latest

      - name: Rollout restart no namespace demos
        run: |
          kubectl rollout restart deployment/auth-demo -n demos
          kubectl rollout status deployment/auth-demo -n demos --timeout=120s

      - name: Verificar pods
        run: |
          kubectl get pods -n demos
